server:
  port: ${PORT:8082} # Uses $PORT environment variable when deployed to Cloud Run, defaults to 8082 locally
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: false # set true in prod

spring:
  application:
    name: renters-ready
  datasource:
    url: jdbc:postgresql://localhost:5434/rentersready # Port 5434 to avoid conflict with 5432 & 5433
    username: rentersready
    password: rentersready_dev
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

jasypt:
  encryptor:
    password: ${JASYPT_PASSWORD:dev-encryption-key-change-in-prod}
    algorithm: PBEWithMD5AndDES

logging:
  level:
    com.rentersready: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
