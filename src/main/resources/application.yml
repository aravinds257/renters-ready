server:
  port: ${PORT:8082} # Uses $PORT environment variable when deployed to Cloud Run, defaults to 8082 locally
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: false # set true in prod

spring:
  application:
    name: renters-ready
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:rentersready;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

jasypt:
  encryptor:
    password: ${JASYPT_PASSWORD:dev-encryption-key-change-in-prod}
    algorithm: PBEWithMD5AndDES

logging:
  level:
    com.rentersready: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
