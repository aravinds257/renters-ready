<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Landlord Login</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center py-5">
        <div class="col-md-5 col-lg-4">
            <div class="card p-4 shadow">
                <div class="card-body">
                    <div class="text-center mb-4">
                        <i class="bi bi-shield-lock text-emerald fs-1" style="color: #10b981;"></i>
                        <h3 class="fw-bold mt-2 text-white">Landlord Login</h3>
                        <p class="text-white-50 small">Access your RentersReady compliance portal</p>
                    </div>

                    <div th:if="${param.error}" class="alert alert-danger bg-danger bg-opacity-20 text-white border-0 py-2 small mb-3">
                        Invalid email or password.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-info bg-info bg-opacity-20 text-white border-0 py-2 small mb-3">
                        You have been logged out.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-medium">Email Address</label>
                            <input type="email" class="form-control" id="username" name="username" required placeholder="you@example.com">
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label fw-medium">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="remember-me" name="remember-me">
                            <label class="form-check-label text-white-50 small" for="remember-me">Remember me for 7 days</label>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">Log in</button>
                    </form>

                    <div class="text-center text-white-50 small">
                        Don't have an account? <a th:href="@{/register}" class="text-emerald text-decoration-none fw-semibold" style="color: #10b981;">Sign up</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
