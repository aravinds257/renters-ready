<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Landlord Registration</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center py-4">
        <div class="col-md-6 col-lg-5">
            <div class="card p-4 shadow">
                <div class="card-body">
                    <div class="text-center mb-4">
                        <i class="bi bi-person-plus text-emerald fs-1" style="color: #10b981;"></i>
                        <h3 class="fw-bold mt-2 text-white">Create Landlord Account</h3>
                        <p class="text-white-50 small">Start managing your properties &amp; Renters' Rights compliance</p>
                    </div>

                    <form th:action="@{/register}" th:object="${registerForm}" method="post">
                        <div class="mb-3">
                            <label for="fullName" class="form-label fw-medium">Full Name</label>
                            <input type="text" class="form-control" id="fullName" th:field="*{fullName}"
                                   th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''" placeholder="Jane Doe">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-medium">Email Address</label>
                            <input type="email" class="form-control" id="email" th:field="*{email}"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" placeholder="jane@example.com">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="phone" class="form-label fw-medium">Phone Number <span class="text-white-50">(optional)</span></label>
                                <input type="text" class="form-control" id="phone" th:field="*{phone}" placeholder="07123 456789">
                            </div>
                            <div class="col-md-6">
                                <label for="companyName" class="form-label fw-medium">Company Name <span class="text-white-50">(optional)</span></label>
                                <input type="text" class="form-control" id="companyName" th:field="*{companyName}" placeholder="e.g. Apex Lettings Ltd">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-medium">Password</label>
                            <input type="password" class="form-control" id="password" th:field="*{password}"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''" placeholder="Min. 8 characters">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>

                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label fw-medium">Confirm Password</label>
                            <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}"
                                   th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">Create Account</button>
                    </form>

                    <div class="text-center text-white-50 small">
                        Already registered? <a th:href="@{/login}" class="text-emerald text-decoration-none fw-semibold" style="color: #10b981;">Log in</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
