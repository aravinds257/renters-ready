name: Build and Deploy RentersReady to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-west2 # London region
  SERVICE_NAME: renters-ready
  REPOSITORY: renters-ready-repo

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate Required Secrets
      run: |
        if [ -z "${{ secrets.GCP_PROJECT_ID }}" ]; then
          echo "::error::GitHub Secret 'GCP_PROJECT_ID' is missing or empty! Please add it in Repo Settings > Secrets and variables > Actions."
          exit 1
        fi
        if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
          echo "::error::GitHub Secret 'GCP_SA_KEY' is missing or empty! Please add it in Repo Settings > Secrets and variables > Actions."
          exit 1
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean package -DskipTests

    - name: Google Auth
      id: auth
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Ensure Artifact Registry Repository Exists
      run: |
        gcloud artifacts repositories create ${{ env.REPOSITORY }} \
          --repository-format=docker \
          --location=${{ env.REGION }} \
          --description="Docker repository for ${{ env.SERVICE_NAME }}" || true

    - name: Authorize Docker push
      run: gcloud auth configure-docker europe-west2-docker.pkg.dev --quiet

    - name: Build and Push Container
      run: |
        docker build -t europe-west2-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }} .
        docker push europe-west2-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

    - name: Deploy to Cloud Run
      uses: google-github-actions/deploy-cloudrun@v2
      with:
        service: ${{ env.SERVICE_NAME }}
        region: ${{ env.REGION }}
        image: europe-west2-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
        flags: '--allow-unauthenticated --port=8082'
        env_vars: |
          SPRING_PROFILES_ACTIVE=prod
          DATABASE_URL=${{ secrets.RENTERSREADY_DB_URL }}
          DATABASE_USERNAME=${{ secrets.RENTERSREADY_DB_USERNAME }}
          DATABASE_PASSWORD=${{ secrets.RENTERSREADY_DB_PASSWORD }}
          JASYPT_PASSWORD=${{ secrets.JASYPT_PASSWORD }}
